# Dato diario: 2 videos de curiosidades al día, basados en artículos reales de Wikipedia.
# Repo público: GitHub Actions no gasta minutos del plan. Las claves van en Secrets (nadie las ve).
# GitHub a veces atrasa o se salta los horarios, así que se intenta cada 20 minutos dentro de cada turno:
#   turno A (mañana): desde las 8:07 AM hasta las 6:47 PM (hora RD)
#   turno B (noche):  desde las 7:07 PM hasta las 11:47 PM (hora RD)
# El primer intento que corre hace el video; los demás ven que ya está hecho y terminan en segundos.
name: Video diario
on:
  schedule:
    - cron: "7,27,47 12-22 * * *"
    - cron: "7,27,47 23 * * *"
    - cron: "7,27,47 0-3 * * *"
  workflow_dispatch:
    inputs:
      programado:
        description: "si = lo dispara el reloj de cron-job.org (solo hace video si toca)"
        default: "no"
permissions:
  contents: write
concurrency: video
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # siempre la versión más nueva del registro (evita hacer dos videos en el mismo turno)
      - name: ¿Toca hacer video?
        id: toca
        env:
          EVENTO: ${{ github.event_name }}
          PROGRAMADO: ${{ inputs.programado }}
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib
          ahora = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=-4)))
          h = ahora.hour
          if 8 <= h < 19:
              turno, fecha = "A", ahora.date()
          elif h >= 19:
              turno, fecha = "B", ahora.date()
          elif h < 4:
              turno, fecha = "B", (ahora - datetime.timedelta(days=1)).date()
          else:
              turno, fecha = "", ahora.date()
          hecho = False
          reg = pathlib.Path("registro.txt")
          if reg.exists() and turno:
              for l in reg.read_text(encoding="utf-8").splitlines():
                  p = [x.strip() for x in l.split("|")]
                  if len(p) >= 5 and p[0] == str(fecha) and p[4] == turno:
                      hecho = True
          manual = os.environ["EVENTO"] == "workflow_dispatch" and os.environ.get("PROGRAMADO", "no") != "si"
          si = manual or (bool(turno) and not hecho)
          print(f"turno={turno or '-'} fecha={fecha} ya_hecho={hecho} manual={manual} -> {'HACER VIDEO' if si else 'no toca'}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"si={'true' if si else 'false'}\nturno={turno or 'M'}\nfecha={fecha}\n")
          PY
      - name: Instalar ffmpeg, voz y letra
        if: steps.toca.outputs.si == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q --break-system-packages edge-tts pillow || pip install -q edge-tts pillow
          mkdir -p fuentes
          curl -sSL -o fuentes/Poppins-ExtraBold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-ExtraBold.ttf
      - name: Hacer el video
        if: steps.toca.outputs.si == 'true'
        env:
          PYTHONUNBUFFERED: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USUARIO_TIKTOK: ${{ vars.USUARIO_TIKTOK }}
          TURNO: ${{ steps.toca.outputs.turno }}
          FECHA_TURNO: ${{ steps.toca.outputs.fecha }}
        run: |
          python3 hacer_video.py
          echo "===== GUION ====="; cat salida/guion.txt; echo "===== DESCRIPCION ====="; cat salida/descripcion.txt
      - name: Dejar el video en "Último video"
        if: steps.toca.outputs.si == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultimo -y --cleanup-tag || true
          gh release create ultimo salida/video.mp4 salida/portada.jpg salida/descripcion.txt salida/guion.txt \
            --title "$(head -1 salida/descripcion.txt)" --notes-file salida/descripcion.txt --latest
      - name: Anotar el dato publicado
        if: steps.toca.outputs.si == 'true'
        run: |
          git config user.name "robot-dato"
          git config user.email "robot-dato@users.noreply.github.com"
          git add registro.txt
          git commit -m "Dato del $(date -u +%Y-%m-%d)" || echo "sin cambios"
          git pull --rebase -q || true
          git push
      - name: Publicar en Facebook (Daily Fact Drop)
        id: fb
        if: steps.toca.outputs.si == 'true'
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: "1469691522893283"
        run: |
          [ -n "$FB_PAGE_TOKEN" ] || { echo "sin clave de Facebook"; exit 0; }
          python3 - <<'PY'
          import json, os, pathlib, time, urllib.error, urllib.parse, urllib.request
          tok, page = os.environ["FB_PAGE_TOKEN"], os.environ["FB_PAGE_ID"]
          api = "https://graph.facebook.com/v21.0"
          def llamar(url, data=None, body=None, headers=None):
              if data is not None:
                  body = urllib.parse.urlencode(data).encode()
              req = urllib.request.Request(url, data=body, headers=headers or {}, method="POST" if body else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=300) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"Facebook dio error {e.code}: {e.read()[:600]!r}")
          video = pathlib.Path("salida/video.mp4").read_bytes()
          texto = pathlib.Path("salida/descripcion.txt").read_text(encoding="utf-8").strip()
          ini = llamar(f"{api}/{page}/video_reels", {"upload_phase": "start", "access_token": tok})
          vid = ini["video_id"]
          llamar(ini.get("upload_url") or f"https://rupload.facebook.com/video-upload/v21.0/{vid}", body=video,
                 headers={"Authorization": f"OAuth {tok}", "offset": "0", "file_size": str(len(video))})
          print("Video subido a Facebook:", vid)
          fin = llamar(f"{api}/{page}/video_reels", {"upload_phase": "finish", "video_id": vid, "video_state": "PUBLISHED",
                                                     "description": texto, "access_token": tok})
          print("Respuesta de Facebook:", fin)
          estado = {}
          for _ in range(24):
              time.sleep(15)
              estado = llamar(f"{api}/{vid}?fields=status&access_token={tok}").get("status", {})
              print("Estado:", estado.get("video_status"), estado.get("publishing_phase", {}).get("status"))
              if estado.get("video_status") in ("ready", "error"):
                  break
          if estado.get("video_status") == "error":
              raise SystemExit(f"Facebook rechazó el video: {estado}")
          print("Reel publicado en Daily Fact Drop")
          PY
      - name: Publicar foto en Facebook (con cada video)
        id: fbfoto
        if: steps.toca.outputs.si == 'true'
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: "1469691522893283"
        run: |
          [ -n "$FB_PAGE_TOKEN" ] && [ -f salida/foto_post.jpg ] || { echo "sin clave o sin foto"; exit 0; }
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request, uuid
          tok, page = os.environ["FB_PAGE_TOKEN"], os.environ["FB_PAGE_ID"]
          foto = pathlib.Path("salida/foto_post.jpg").read_bytes()
          texto = pathlib.Path("salida/foto_post.txt").read_text(encoding="utf-8").strip()
          b = uuid.uuid4().hex
          partes = []
          for k, v in (("message", texto), ("published", "true"), ("access_token", tok)):
              partes.append(f'--{b}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode())
          partes.append(f'--{b}\r\nContent-Disposition: form-data; name="source"; filename="dato.jpg"\r\nContent-Type: image/jpeg\r\n\r\n'.encode() + foto + b"\r\n")
          partes.append(f"--{b}--\r\n".encode())
          req = urllib.request.Request(f"https://graph.facebook.com/v21.0/{page}/photos", data=b"".join(partes),
                                       headers={"Content-Type": f"multipart/form-data; boundary={b}"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  print("Foto publicada en Daily Fact Drop:", json.loads(r.read()))
          except urllib.error.HTTPError as e:
              raise SystemExit(f"Facebook dio error {e.code}: {e.read()[:600]!r}")
          PY
      - name: Publicar historias en Facebook (foto y video)
        id: fbhist
        if: steps.toca.outputs.si == 'true'
        continue-on-error: true
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: "1469691522893283"
        run: |
          [ -n "$FB_PAGE_TOKEN" ] || { echo "sin clave de Facebook"; exit 0; }
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.parse, urllib.request, uuid
          tok, page = os.environ["FB_PAGE_TOKEN"], os.environ["FB_PAGE_ID"]
          api = "https://graph.facebook.com/v21.0"
          def llamar(url, data=None, body=None, headers=None):
              if data is not None:
                  body = urllib.parse.urlencode(data).encode()
              req = urllib.request.Request(url, data=body, headers=headers or {}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=300) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f"Facebook dio error {e.code}: {e.read()[:500]!r}")
          fallos = []
          # 1) Historia con la foto del dato
          try:
              foto = pathlib.Path("salida/foto_post.jpg").read_bytes()
              b = uuid.uuid4().hex
              cuerpo = (f'--{b}\r\nContent-Disposition: form-data; name="published"\r\n\r\nfalse\r\n'
                        f'--{b}\r\nContent-Disposition: form-data; name="access_token"\r\n\r\n{tok}\r\n'
                        f'--{b}\r\nContent-Disposition: form-data; name="source"; filename="dato.jpg"\r\nContent-Type: image/jpeg\r\n\r\n').encode() + foto + f"\r\n--{b}--\r\n".encode()
              pid = llamar(f"{api}/{page}/photos", body=cuerpo, headers={"Content-Type": f"multipart/form-data; boundary={b}"})["id"]
              print("Historia de foto:", llamar(f"{api}/{page}/photo_stories", {"photo_id": pid, "access_token": tok}))
          except Exception as e:
              fallos.append(f"foto: {e}")
          # 2) Historia con el video
          try:
              video = pathlib.Path("salida/video.mp4").read_bytes()
              ini = llamar(f"{api}/{page}/video_stories", {"upload_phase": "start", "access_token": tok})
              vid = ini["video_id"]
              llamar(ini.get("upload_url") or f"https://rupload.facebook.com/video-upload/v21.0/{vid}", body=video,
                     headers={"Authorization": f"OAuth {tok}", "offset": "0", "file_size": str(len(video))})
              print("Historia de video:", llamar(f"{api}/{page}/video_stories", {"upload_phase": "finish", "video_id": vid, "access_token": tok}))
          except Exception as e:
              fallos.append(f"video: {e}")
          if fallos:
              raise SystemExit("No salió: " + " | ".join(fallos))
          print("Historias publicadas en Daily Fact Drop")
          PY
      - name: Avisar al celular (ntfy)
        if: always() && steps.toca.outputs.si == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ESTADO: ${{ job.status }}
          FB: ${{ steps.fb.outcome }}
          FBFOTO: ${{ steps.fbfoto.outcome }}
          FBHIST: ${{ steps.fbhist.outcome }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          base = "https://github.com/Cheloelmele17/historias-rd/releases"
          desc = pathlib.Path("salida/descripcion.txt")
          if os.environ["ESTADO"] == "success" and desc.exists():
              fb = {"success": "\n\n✅ Ya se publicó solo en Facebook.", "failure": "\n\n⚠️ No se pudo publicar en Facebook."}.get(os.environ.get("FB", ""), "")
              fb += {"success": "\n📷 También se publicó la foto del día.", "failure": "\n⚠️ La foto del día no se pudo publicar."}.get(os.environ.get("FBFOTO", ""), "")
              fb += {"success": "\n📖 Y las historias (foto y video).", "failure": "\n⚠️ Alguna historia no se pudo publicar."}.get(os.environ.get("FBHIST", ""), "")
              msg = {"title": "Video listo para TikTok", "message": desc.read_text(encoding="utf-8")[:3400] + fb,
                     "click": base + "/download/ultimo/video.mp4", "attach": base + "/download/ultimo/portada.jpg",
                     "actions": [{"action": "view", "label": "Descargar video", "url": base + "/download/ultimo/video.mp4"}],
                     "filename": "portada.jpg", "tags": ["movie_camera"]}
          else:
              msg = {"title": "Este intento no salió", "tags": ["warning"],
                     "message": "El robot no pudo hacer el video (no pasó la revisión de datos o falló algo). En 20 minutos lo intenta de nuevo.",
                     "click": "https://github.com/Cheloelmele17/historias-rd/actions"}
          msg["topic"] = os.environ["NTFY_TOPIC"]
          req = urllib.request.Request("https://ntfy.sh", data=json.dumps(msg).encode(), headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=30)
          print("Aviso enviado")
          PY
