# Dato diario: 2 videos de curiosidades al día, basados en artículos reales de Wikipedia.
# Repo público: GitHub Actions no gasta minutos del plan. Las claves van en Secrets (nadie las ve).
name: Video diario
on:
  schedule:
    - cron: "41 15 * * *"   # 11:41 AM RD
    - cron: "17 23 * * *"   # 7:17 PM RD
  workflow_dispatch:
permissions:
  contents: write
concurrency: video
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg, voz y letra
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q --break-system-packages edge-tts pillow || pip install -q edge-tts pillow
          mkdir -p fuentes
          curl -sSL -o fuentes/Poppins-ExtraBold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-ExtraBold.ttf
      - name: Hacer el video
        env:
          PYTHONUNBUFFERED: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USUARIO_TIKTOK: ${{ vars.USUARIO_TIKTOK }}
        run: |
          python3 hacer_video.py
          echo "===== GUION ====="; cat salida/guion.txt; echo "===== DESCRIPCION ====="; cat salida/descripcion.txt
      - name: Dejar el video en "Último video"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultimo -y --cleanup-tag || true
          gh release create ultimo salida/video.mp4 salida/portada.jpg salida/descripcion.txt salida/guion.txt \
            --title "$(head -1 salida/descripcion.txt)" --notes-file salida/descripcion.txt --latest
      - name: Anotar el dato publicado
        run: |
          git config user.name "robot-dato"
          git config user.email "robot-dato@users.noreply.github.com"
          git add registro.txt
          git commit -m "Dato del $(date -u +%Y-%m-%d)" || echo "sin cambios"
          git push
      - name: Avisar al celular (ntfy)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ESTADO: ${{ job.status }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          base = "https://github.com/Cheloelmele17/historias-rd/releases"
          desc = pathlib.Path("salida/descripcion.txt")
          if os.environ["ESTADO"] == "success" and desc.exists():
              msg = {"title": "Video listo para TikTok", "message": desc.read_text(encoding="utf-8")[:3500],
                     "click": base + "/tag/ultimo", "attach": base + "/download/ultimo/portada.jpg",
                     "filename": "portada.jpg", "tags": ["movie_camera"]}
          else:
              msg = {"title": "Este turno no salió video", "tags": ["warning"],
                     "message": "El robot no pudo hacer el video (no pasó la revisión de datos o falló algo). El próximo turno lo intenta de nuevo.",
                     "click": "https://github.com/Cheloelmele17/historias-rd/actions"}
          msg["topic"] = os.environ["NTFY_TOPIC"]
          req = urllib.request.Request("https://ntfy.sh", data=json.dumps(msg).encode(), headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=30)
          print("Aviso enviado")
          PY
