name: Conectar TikTok (una sola vez)
on:
  workflow_dispatch:
    inputs:
      codigo:
        description: "Código que sale en la página de conexión"
        required: true
permissions:
  contents: write
jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cambiar el código por el permiso
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          CODIGO: ${{ inputs.codigo }}
        run: python3 tiktok_borrador.py conectar "$CODIGO"
      - name: Guardar el permiso cifrado
        run: |
          git config user.name "robot-dato"
          git config user.email "robot-dato@users.noreply.github.com"
          git add tiktok_token.enc
          git commit -m "Permiso de TikTok" || echo "sin cambios"
          git pull --rebase -q || true
          git push
