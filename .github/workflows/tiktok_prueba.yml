name: Probar borrador de TikTok
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bajar el último video
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p salida && gh release download ultimo -p video.mp4 -D salida
      - name: Mandarlo como borrador
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          python3 tiktok_borrador.py subir salida/video.mp4
          git config user.name "robot-dato"
          git config user.email "robot-dato@users.noreply.github.com"
          git add tiktok_token.enc
          git commit -m "Renovar permiso de TikTok" || echo "permiso sin cambios"
          git pull --rebase -q || true
          git push || true
