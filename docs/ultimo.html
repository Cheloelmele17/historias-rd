<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Último video – Daily Fact Drop</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14112B">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#14112B;color:#fff}
.w{max-width:520px;margin:0 auto;padding:18px}
h1{font-size:20px;margin:6px 0 2px;color:#2EF2C2}.s{color:#aaa;font-size:13px;margin-bottom:12px}
video{width:100%;border-radius:14px;background:#000;max-height:60vh}
.b{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:14px;border-radius:12px;border:0;font-size:17px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.m{background:#2EF2C2;color:#14112B}.o{background:#2a2660;color:#fff}
.t{background:#201c42;border-radius:12px;padding:12px;white-space:pre-wrap;font-size:14px;line-height:1.4;margin-top:4px}
label{font-size:13px;color:#2EF2C2;font-weight:700;display:block;margin-top:14px}
</style></head><body><div class="w">
<h1 id="n">Cargando…</h1><div class="s" id="f"></div>
<video id="v" controls playsinline preload="metadata"></video>
<a class="b m" id="d" download="video.mp4">⬇️ Descargar video</a>
<label>TÍTULO (YouTube)</label><div class="t" id="ti"></div><button class="b o" onclick="cp('ti',this)">📋 Copiar título</button>
<label>DESCRIPCIÓN (TikTok / YouTube)</label><div class="t" id="de"></div><button class="b o" onclick="cp('de',this)">📋 Copiar descripción</button>
</div><script>
function cp(id,b){navigator.clipboard.writeText(document.getElementById(id).innerText).then(()=>{const t=b.innerText;b.innerText='✅ Copiado';setTimeout(()=>b.innerText=t,1500)})}
fetch('ultimo.json?x='+Date.now()).then(r=>r.json()).then(j=>{
 document.getElementById('n').innerText='FACT #'+j.numero+' · '+j.categoria;
 document.getElementById('f').innerText='Hecho: '+j.fecha;
 const u=j.video+'?v='+j.version; document.getElementById('v').src=u; document.getElementById('d').href=u;
 document.getElementById('ti').innerText=j.titulo; document.getElementById('de').innerText=j.descripcion;
}).catch(()=>{document.getElementById('n').innerText='Todavía no hay video'});
</script></body></html>
